# Cấu hình Pages CMS (https://app.pagescms.org)
media:
  input: assets/uploads
  output: /assets/uploads
  extensions: [jpg, jpeg, png, webp, gif, svg]

content:
  # =================== NỘI DUNG ĐĂNG THƯỜNG XUYÊN ===================
  - name: san_pham
    label: Sản phẩm & quà tặng
    type: collection
    path: _san_pham
    filename: "{primary}.md"
    view:
      fields: [title, danh_muc, an]
      sort: [thu_tu, title]
      default: { sort: thu_tu, order: asc }
    fields:
      - { name: title, label: Tên sản phẩm, type: string, required: true }
      - name: danh_muc
        label: Hiện ở mục
        type: select
        required: true
        options:
          values:
            - { value: dong-phuc, label: Các sản phẩm của TrueFit }
            - { value: merchandise, label: Quà tặng sự kiện }
      - { name: anh, label: Ảnh chính, type: image, required: true, description: "Ảnh vuông 800×800, ưu tiên PNG nền trong" }
      - { name: dat_tu, label: Đặt từ, type: string, description: "VD: 50 áo – để trống nếu không muốn hiện" }
      - { name: chat_lieu, label: Chất liệu, type: string }
      - { name: mo_ta, label: Mô tả ngắn, type: text }
      - { name: thu_vien, label: Ảnh thực tế, type: image, options: { multiple: true }, description: "Có thể chọn nhiều ảnh – hiện thành lưới dưới trang sản phẩm" }
      - { name: thu_tu, label: Thứ tự, type: number, default: 50, description: "Số nhỏ hiện trước" }
      - { name: an, label: Ẩn khỏi web, type: boolean, default: false }
      - { name: body, label: Nội dung chi tiết (không bắt buộc), type: rich-text }

  - name: khach_hang
    label: Khách hàng & dự án
    type: collection
    path: _khach_hang
    filename: "{primary}.md"
    view:
      fields: [title, nganh]
      default: { sort: thu_tu, order: asc }
    fields:
      - { name: title, label: Tên khách hàng, type: string, required: true }
      - { name: logo, label: Logo, type: image, required: true, description: "PNG nền trong, khoảng 600×400" }
      - { name: nganh, label: Ngành, type: string, description: "VD: F&B, Tài chính" }
      - { name: da_may, label: Đã làm, type: string, description: "VD: 500 áo polo, 300 túi tote" }
      - { name: noi_bat, label: Hiện ở «Câu chuyện khách hàng tiêu biểu» trang chủ, type: boolean, default: false }
      - { name: anh_bia, label: Ảnh bìa câu chuyện, type: image, description: "Ảnh ngang 4:3, ảnh thật dự án. Để trống sẽ hiện logo" }
      - { name: tieu_de_bai, label: Tiêu đề câu chuyện, type: string, description: "VD: Đồng bộ 500 nhân viên trong 10 ngày" }
      - { name: tom_tat, label: Tóm tắt 1 dòng, type: text }
      - { name: thu_vien, label: Ảnh dự án thực tế, type: image, options: { multiple: true } }
      - { name: thu_tu, label: Thứ tự, type: number, default: 50 }
      - { name: body, label: "Câu chuyện dự án (gợi ý: Khách hàng · Bài toán · Giải pháp · Kết quả)", type: rich-text }

  - name: tin_tuc
    label: Tin tức
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date]
      default: { sort: date, order: desc }
    fields:
      - { name: title, label: Tiêu đề, type: string, required: true }
      - { name: date, label: Ngày đăng, type: date }
      - { name: anh, label: Ảnh bìa, type: image }
      - { name: mo_ta, label: Tóm tắt, type: text }
      - { name: body, label: Nội dung, type: rich-text }

  # =================== TRANG CHỦ (theo thứ tự từ trên xuống) ===================
  - name: tc_1
    label: "Trang chủ ① Đầu trang (banner trượt)"
    type: file
    path: _data/trang_chu/1_dau_trang.yml
    fields:
      - { name: uu_dai, label: Thanh ưu đãi trên cùng, type: string }
      - { name: nut_tu_van, label: Chữ trên nút hotline, type: string, description: "Nút hotline hiện ở slide không có nút riêng" }
      - { name: tu_chuyen_giay, label: Tự chuyển slide sau (giây), type: number, default: 5 }
      - name: slides
        label: Các slide banner
        type: object
        list: true
        description: "Kéo ⋮⋮ để đổi thứ tự slide. Slide đầu tiên hiện đầu tiên khi mở web."
        fields:
          - { name: tieu_de, label: Tiêu đề lớn, type: string, description: "Bọc *dấu sao* để tô cam. VD: *Giải pháp* đồng phục doanh nghiệp *trọn gói*" }
          - { name: dong_phu, label: Dòng chữ nhỏ bên dưới, type: text, description: "Xuống dòng bằng Enter" }
          - { name: anh, label: Ảnh banner, type: image, description: "Ảnh ngang 1920×800. Để chữ đọc rõ, chừa khoảng trống ở giữa ảnh (VD người mẫu đứng 2 bên)" }
          - { name: nut_chu, label: Chữ trên nút (không bắt buộc), type: string, description: "Để trống thì hiện nút hotline" }
          - { name: nut_link, label: Link của nút, type: string, description: "VD: /#qua-tang, /san-pham/ hoặc link Zalo" }

  - name: tc_2
    label: "Trang chủ ② Hai hướng: Đồng phục | Quà tặng"
    type: file
    path: _data/trang_chu/2_gioi_thieu.yml
    fields:
      - { name: dong_nho, label: Dòng chữ nhỏ trên tiêu đề, type: string }
      - { name: tieu_de, label: Tiêu đề, type: string, description: "Bọc *dấu sao* để tô cam" }
      - name: cua
        label: 2 ô lớn (Đồng phục / Quà tặng)
        type: object
        list: true
        fields:
          - { name: ten, label: Tên, type: string }
          - { name: mo_ta, label: Mô tả ngắn, type: string }
          - { name: anh, label: Ảnh, type: image, description: "Ảnh vuông, ưu tiên ảnh thật sản phẩm" }
          - { name: link, label: Link, type: string, description: "VD: /san-pham/dong-phuc/" }
          - { name: nut, label: Chữ trên nút, type: string }

  - name: tc_3
    label: "Trang chủ ④ Số liệu"
    type: file
    path: _data/trang_chu/3_cam_ket.yml
    fields:
      - name: so_lieu
        label: Các ô số liệu
        type: object
        list: true
        fields:
          - { name: nhom, label: Dòng nhỏ phía trên, type: string }
          - { name: so, label: Con số, type: string, description: "VD: 40.000 hoặc 500+ – số sẽ tự chạy đếm" }
          - { name: nhan, label: Dòng phía dưới, type: string }

  - name: tc_4
    label: "Trang chủ ⑤ Vì sao chọn TrueFit"
    type: file
    path: _data/trang_chu/4_ly_do.yml
    fields:
      - { name: tieu_de, label: Tiêu đề, type: string, description: "Bọc *dấu sao* để tô cam" }
      - name: ly_do
        label: Các lý do
        type: object
        list: true
        fields:
          - { name: ten, label: Tiêu đề, type: string }
          - { name: mo_ta, label: Mô tả, type: text }

  - name: tc_5
    label: "Trang chủ ⑥ Quy trình"
    type: file
    path: _data/trang_chu/5_quy_trinh.yml
    fields:
      - { name: tieu_de, label: Tiêu đề, type: string }
      - { name: dong_phu, label: Dòng phụ, type: string }
      - name: buoc
        label: Các bước
        type: object
        list: true
        fields:
          - { name: ten, label: Tên bước, type: string }
          - { name: mo_ta, label: Mô tả, type: text }

  - name: tc_6
    label: "Trang chủ ⑦ Khách hàng & câu chuyện"
    type: file
    path: _data/trang_chu/6_khach_hang.yml
    fields:
      - { name: tieu_de, label: Tiêu đề, type: string, description: "Logo chạy ngang & các card lấy từ mục «Khách hàng & dự án»" }
      - { name: mo_ta, label: Mô tả, type: text }
      - { name: tieu_de_cau_chuyen, label: Tiêu đề hàng câu chuyện, type: string, description: "Bọc *dấu sao* để tô cam" }

  - name: tc_7
    label: "Trang chủ ③ Sản phẩm nổi bật"
    type: file
    path: _data/trang_chu/7_san_pham.yml
    fields:
      - { name: tieu_de_san_pham, label: Tiêu đề, type: string, description: "Sản phẩm lấy theo «Thứ tự» ở mục «Sản phẩm & quà tặng» (số nhỏ hiện trước)" }
      - { name: tab_dong_phuc, label: Chữ trên tab đồng phục, type: string }
      - { name: tab_qua_tang, label: Chữ trên tab quà tặng, type: string }
      - { name: so_luong, label: Số sản phẩm mỗi tab, type: number, default: 4 }

  - name: tc_9
    label: "Trang chủ ⑧ Báo giá & cuối trang"
    type: file
    path: _data/trang_chu/9_cuoi_trang.yml
    fields:
      - { name: tieu_de_footer, label: Tiêu đề footer, type: string }
      - { name: mo_ta_footer, label: Mô tả footer, type: text }
      - { name: tieu_de_bao_gia, label: Tiêu đề khối báo giá (cuối trang chủ), type: string, description: "Bọc *dấu sao* để tô đen" }
      - { name: mo_ta_bao_gia, label: Mô tả khối báo giá, type: text }
      - { name: can_gui, label: Danh sách «Chỉ cần gửi», type: string, list: true }
      - { name: tieu_de_keu_goi, label: Tiêu đề khối kêu gọi (cuối các trang con), type: string }
      - { name: mo_ta_keu_goi, label: Mô tả khối kêu gọi, type: text }

  # =================== CÀI ĐẶT CHUNG ===================
  - name: lien_he
    label: Liên hệ & mạng xã hội
    type: file
    path: _data/lien_he.yml
    fields:
      - { name: hotline, label: Hotline (cách hiển thị), type: string, description: "VD: 0909 914 059" }
      - { name: hotline_so, label: Hotline (chỉ số), type: string, description: "VD: 0909914059 – dùng cho nút gọi" }
      - { name: zalo, label: Link Zalo, type: string }
      - { name: email, label: Email, type: string }
      - name: kenh
        label: Icon liên hệ ở footer
        type: object
        list: true
        fields:
          - { name: ten, label: Tên kênh, type: string }
          - { name: link, label: Link, type: string, description: "Gọi điện: tel:0909914059 · Email: mailto:ten@gmail.com" }
          - { name: icon, label: Icon (ảnh vuông), type: image }

  - name: chinh_sach
    label: Chính sách
    type: collection
    path: _chinh_sach
    filename: "{primary}.md"
    view:
      default: { sort: thu_tu, order: asc }
    fields:
      - { name: title, label: Tiêu đề, type: string, required: true }
      - { name: thu_tu, label: Thứ tự, type: number }
      - { name: body, label: Nội dung, type: rich-text }
