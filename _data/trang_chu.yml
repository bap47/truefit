  - ten: "Ký kết, sản xuất"
    mo_ta: "Chốt bảng size, ký hợp đồng và sản xuất."
  - ten: "Kiểm tra, giao hàng"
    mo_ta: "Kiểm tra từng sản phẩm, đóng gói và giao tận nơi."

cta:
  tieu_de: "Gửi logo, nhận mẫu thiết kế miễn phí"
  mo_ta: "Nhắn tên công ty, số lượng dự kiến và sản phẩm cần làm. TrueFit phản hồi trong vòng 15 phút."
