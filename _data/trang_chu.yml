gioi_thieu:
  nho: Đến với Truefit
  tieu_de: <span>MIỄN PHÍ</span> may mẫu - <span>MIỄN PHÍ</span> vận chuyển
  mo_ta: "Cung cấp giải pháp đồng phục cho doanh nghiệp: cam kết chất lượng cao
    cấp, quy trình phục vụ trọn gói: Tận tay - tận tình - tận nơi."
cam_ket_tieu_de: TRUEFIT cam kết
cam_ket:
  - ten: Chất lượng - Bảo hành
    y:
      - Bảo hành 3 tháng/ sản phẩm.
      - Miễn phí sửa chữa lỗi may thêu
      - Tất cả sản phẩm đều đạt chuẩn
  - ten: Tiến độ - Dịch vụ
    y:
      - Cam kết đúng tiến độ
      - Đáp ứng nhanh mọi nhu cầu
      - Hỗ trợ tận tâm suốt quá trình
  - ten: Cam kết hoàn tiền
    y:
      - Hoàn tiền 100% những sản phẩm lỗi không thể khắc phục
      - Luôn ưu tiên quyền lợi khách hàng lên hàng đầu
so_lieu:
  - nhom: Công suất sản xuất
    so: 40000
    hien_thi: "40.000"
    nhan: Sản phẩm/tháng
  - nhom: Quy mô sản xuất
    so: 4
    hien_thi: "04"
    nhan: Xưởng may chuyên biệt
  - nhom: Sản phẩm sản xuất
    so: 12
    hien_thi: 12+
    nhan: Sản phẩm/quà tặng
  - nhom: Giao hàng
    so: 0
    hien_thi: Free
    nhan: Vận chuyển miễn phí
ly_do_tieu_de: Tại sao nên chọn <span>TRUEFIT?</span>
ly_do:
  - ten: Chuyên gia đồng phục
    mo_ta: Đội ngũ tư vấn & thiết kế am hiểu văn hoá và nhận diện thương hiệu từng
      doanh nghiệp.
  - ten: Cam kết chất lượng
    mo_ta: Sản xuất tại xưởng đạt chuẩn, kiểm soát chặt chẽ từ vải đến thành phẩm.
  - ten: Linh hoạt tốc độ
    mo_ta: Quy trình khép kín giúp xử lý nhanh. Đáp ứng đơn hàng gấp & số lượng lớn
      vẫn đảm bảo chất lượng.
  - ten: May mẫu miễn phí
    mo_ta: Hỗ trợ may mẫu MIỄN PHÍ (với đơn hàng đủ điều kiện) trước khi sản xuất
      hàng loạt.
quy_trinh_tieu_de: Quy trình làm việc
quy_trinh_phu: Chỉ với 5 bước đơn giản
quy_trinh:
  - ten: Tư vấn - Xác định nhu cầu
    mo_ta: "Gửi yêu cầu: số lượng, ngân sách,... Tư vấn kiểu dáng: màu sắc, vị trí
      logo, loại áo."
  - ten: Lựa chọn vải - Báo giá
    mo_ta: Tư vấn chuyên sâu về chất liệu vải. Gửi mẫu thực tế, mẫu online cho khách
      hàng.
  - ten: Thiết kế - Duyệt mẫu thật
    mo_ta: Thiết kế mẫu demo. Chỉnh sửa theo ý khách hàng. Tiến hành may mẫu thực tế.
  - ten: Ký kết - Sản xuất
    mo_ta: Chốt bảng size đồng phục. Ký kết và tiến hành sản xuất.
  - ten: Kiểm tra - Giao hàng
    mo_ta: Kiểm tra chất lượng sản phẩm. Đóng gói và giao hàng tận nơi.
khach_hang_tieu_de: <span>500+</span> khách hàng của TRUEFIT
khach_hang_mo_ta: TrueFit với kinh nghiệm trong lĩnh vực thiết kế và cung cấp
  đồng phục cho các công ty, xí nghiệp, quán cafe, nhà hàng, đồng phục lớp, đồng
  phục nhóm. Sẵn sàng hỗ trợ giao hàng toàn quốc.
san_pham_tieu_de: Các sản phẩm của <span>TRUEFIT</span>
qua_tang_tieu_de: Quà tặng sự kiện của <span>TRUEFIT</span>
qua_tang_luu_y: "Lưu ý: danh mục sản phẩm quà tặng của TrueFit còn nhiều lựa
  chọn khác ngoài những mẫu được trình bày"
bao_quan_tieu_de: Hướng dẫn bảo quản sản phẩm
bao_quan_luu_y: "Lưu ý: Chính sách bảo hành không áp dụng cho lỗi sản phẩm do
  bảo quản sai hướng dẫn"
bao_quan:
  - Phơi ở nơi thoáng mát, tránh ánh nắng trực tiếp
  - Phân loại đồ trắng và đồ màu khi giặt
  - Giặt với nước lạnh (hoặc nhiệt độ ≤ 30 độ)
  - Không sử dụng máy sấy để sấy quần áo
  - Ủi ở nhiệt độ vừa. Lộn trái sản phẩm khi ủi
  - Không sử dụng thuốc tẩy khi giặt sản phẩm
lien_he_tieu_de: Liên hệ ngay với TRUEFIT nha!
lien_he_mo_ta: Chúng tôi luôn sẵn sàng lắng nghe mọi góp ý từ khách hàng để có
  thể hoàn thiện sản phẩm và nâng cao trải nghiệm sử dụng dịch vụ tốt hơn
cta:
  tieu_de: Gửi logo, nhận mẫu thiết kế miễn phí
  mo_ta: Nhắn tên công ty, số lượng dự kiến và sản phẩm cần làm. TrueFit tư vấn
    nhanh qua Zalo hoặc hotline.
