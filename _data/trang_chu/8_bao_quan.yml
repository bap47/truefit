# Sửa trong CMS: Trang chủ
tieu_de: Hướng dẫn bảo quản sản phẩm
luu_y: 'Lưu ý: Chính sách bảo hành không áp dụng cho lỗi sản phẩm do bảo quản sai hướng dẫn'
buoc:
- Phơi ở nơi thoáng mát, tránh ánh nắng trực tiếp
- Phân loại đồ trắng và đồ màu khi giặt
- Giặt với nước lạnh (hoặc nhiệt độ ≤ 30 độ)
- Không sử dụng máy sấy để sấy quần áo
- Ủi ở nhiệt độ vừa. Lộn trái sản phẩm khi ủi
- Không sử dụng thuốc tẩy khi giặt sản phẩm
