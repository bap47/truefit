# ===== Cấu hình chung TrueFit =====
title: TrueFit
description: Xưởng may đồng phục & merchandise cho doanh nghiệp. Fit your brand – Fit your team.
url: "https://truefituniform.shop"
baseurl: ""
lang: vi

# Liên hệ (dùng khắp trang)
phone: "0909 914 059"
phone_raw: "0909914059"
zalo: "https://zalo.me/0909914059"
email: "truefit.hello@gmail.com"
facebook: "https://www.facebook.com/truefituniform"

timezone: Asia/Ho_Chi_Minh
permalink: /tin-tuc/:title/
markdown: kramdown

collections:
  san_pham:
    output: true
    permalink: /san-pham/:name/
  khach_hang:
    output: true
    permalink: /khach-hang/:name/
  chinh_sach:
    output: true
    permalink: /chinh-sach/:name/
  quy_trinh:
    output: true
    permalink: /quy-trinh/:name/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: san_pham }
    values: { layout: product }
  - scope: { path: "", type: khach_hang }
    values: { layout: client }
  - scope: { path: "_san_pham/dong-phuc", type: san_pham }
    values: { danh_muc: dong-phuc }
  - scope: { path: "_san_pham/qua-tang", type: san_pham }
    values: { danh_muc: merchandise }
  - scope: { path: "_khach_hang/dong-phuc", type: khach_hang }
    values: { nhom: dong-phuc }
  - scope: { path: "_khach_hang/qua-tang", type: khach_hang }
    values: { nhom: qua-tang }
  - scope: { path: "", type: chinh_sach }
    values: { layout: policy }
  - scope: { path: "", type: quy_trinh }
    values: { layout: process }
  - scope: { path: "" }
    values: { layout: default }

exclude:
  - README.md
  - HUONG-DAN.md
  - .pages.yml
  - Gemfile
  - Gemfile.lock
  # File cũ trước khi tách thư mục (đã chuyển vào dong-phuc/ và qua-tang/) – có thể xoá
